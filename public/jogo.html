<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jogo da Velha - Partida</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <p id="status-conexao">Conectando...</p>

    <section id="tela-arena">
      <div class="jogadores">
        <div class="jogador">
          <span class="simbolo x">X</span>
          <span id="nome-x">-</span>
          <span id="placar-x" class="placar"></span>
        </div>
        <div class="jogador">
          <span class="simbolo o">O</span>
          <span id="nome-o">-</span>
          <span id="placar-o" class="placar"></span>
        </div>
      </div>

      <p id="indicador-turno">Aguardando...</p>
      <p id="cronometro"></p>

      <div id="tabuleiro">
        <button type="button" class="celula" data-pos="0"></button>
        <button type="button" class="celula" data-pos="1"></button>
        <button type="button" class="celula" data-pos="2"></button>
        <button type="button" class="celula" data-pos="3"></button>
        <button type="button" class="celula" data-pos="4"></button>
        <button type="button" class="celula" data-pos="5"></button>
        <button type="button" class="celula" data-pos="6"></button>
        <button type="button" class="celula" data-pos="7"></button>
        <button type="button" class="celula" data-pos="8"></button>
      </div>

      <p id="msg-arena"></p>
      <p id="info-sala">Sala <strong id="arena-codigo"></strong> · você joga com <strong id="arena-simbolo"></strong></p>

      <div id="aviso-desconexao" hidden></div>

      <div class="chat">
        <ul id="chat-mensagens"></ul>
        <form id="form-chat">
          <input id="input-chat" type="text" maxlength="200" placeholder="Digite uma mensagem..." autocomplete="off">
          <button type="submit">Enviar</button>
        </form>
      </div>

      <button id="btn-sair-jogo" type="button">Voltar ao lobby</button>
    </section>

    <div id="modal-fim" hidden>
      <div class="modal-caixa">
        <h2 id="fim-titulo"></h2>
        <p id="fim-detalhe"></p>
        <p id="fim-revanche"></p>
        <button id="btn-jogar-novamente" type="button">Jogar de novo</button>
        <button id="btn-voltar" type="button">Voltar ao lobby</button>
      </div>
    </div>
  </main>

  <script src="js/jogo.js"></script>
</body>
</html>
