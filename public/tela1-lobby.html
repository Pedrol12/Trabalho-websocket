<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jogo da Velha Multiplayer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <p id="status-conexao">Conectando ao servidor...</p>

    <section id="tela-lobby">
      <h1>Jogo da Velha</h1>

      <div class="campos">
        <label for="input-nome">Seu apelido</label>
        <input id="input-nome" type="text" maxlength="20" placeholder="Ex.: Pedro">

        <label for="input-codigo">Código da sala</label>
        <input id="input-codigo" type="text" maxlength="10" placeholder="Ex.: AB12">
        <small>Para entrar em uma sala, digite o código. Para criar uma nova, deixe em branco.</small>
      </div>

      <div id="area-sala" hidden>
        <p>Código da sua sala:</p>
        <strong id="codigo-sala"></strong>
        <p>Envie o código para o outro jogador e aguarde.</p>
      </div>

      <p id="msg-lobby"></p>

      <div class="botoes">
        <button id="btn-criar" type="button">Criar sala</button>
        <button id="btn-entrar" type="button">Entrar por código</button>
      </div>
    </section>

    <section id="tela-arena" hidden>
      <div class="jogadores">
        <div class="jogador">
          <span class="simbolo x">X</span>
          <span id="nome-x">-</span>
        </div>
        <div class="jogador">
          <span class="simbolo o">O</span>
          <span id="nome-o">-</span>
        </div>
      </div>

      <p id="indicador-turno">Aguardando...</p>

      <div id="tabuleiro">
        <button type="button" class="celula" data-pos="0"></button>
        <button type="button" class="celula" data-pos="1"></button>
        <button type="button" class="celula" data-pos="2"></button>
        <button type="button" class="celula" data-pos="3"></button>
        <button type="button" class="celula" data-pos="4"></button>
        <button type="button" class="celula" data-pos="5"></button>
        <button type="button" class="celula" data-pos="6"></button>
        <button type="button" class="celula" data-pos="7"></button>
        <button type="button" class="celula" data-pos="8"></button>
      </div>

      <p id="msg-arena"></p>
      <p id="info-sala">Sala <strong id="arena-codigo"></strong> · você joga com <strong id="arena-simbolo"></strong></p>
    </section>

        <div id="modal-fim" hidden>
      <div class="modal-caixa">
        <h2 id="fim-titulo"></h2>
        <p id="fim-detalhe"></p>
        <p id="fim-revanche"></p>
        <button id="btn-jogar-novamente" type="button">Jogar de novo</button>
        <button id="btn-voltar" type="button">Voltar ao lobby</button>
      </div>
    </div>
  </main>

  <script src="js/websocket.js"></script>
</body>
</html>
